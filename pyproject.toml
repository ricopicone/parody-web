[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parody-web"
version = "0.86.0"
description = "Django app that serves a parody build artifact as a public book site, with section-level auth gating (public = online-only subset; owner = full book)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rico Picone", email = "dr@ricopic.one" }]
keywords = ["parody", "django", "publishing", "book", "textbook"]
classifiers = [
  "Framework :: Django",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]
dependencies = ["Django>=5.0,<6.0"]

[project.optional-dependencies]
# Per-section print PDFs are sliced out of the full book PDF at request time.
# Optional so a deployment that serves no print PDFs keeps parody-web's
# single-dependency footprint; without it the PDF affordance simply never
# renders (see parody_web/printing.py).
print = [
    "pypdf>=4.0",
]
# Read-along needs PyMuPDF to measure the typeset page (word boxes and the
# vector rules that ARE the blanks) and boto3 to synthesise with Polly. Both
# are generation-time concerns; a host that never runs `generate_readalong`
# still serves whatever tracks it was given, because serving only reads the
# database and a cached mp3.
readalong = [
    "boto3>=1.34",
    "PyMuPDF>=1.24",
]

[project.urls]
Homepage = "https://github.com/ricopicone/parody-web"
Issues = "https://github.com/ricopicone/parody-web/issues"

[tool.setuptools.packages.find]
include = ["parody_web*"]

[tool.setuptools.package-data]
parody_web = ["templates/parody_web/*.html", "templates/registration/*.html",
              "static/parody_web/eclipse/*.svg",
              "static/parody_web/css/*.css",
              "static/parody_web/fonts/*.woff2",
              "static/parody_web/fonts/OFL.txt"]
# The annotator's bundle is BUILT but committed, so a host never needs Node.
# Anything missing from this list is silently absent from the wheel — the app
# installs, the viewer never appears, and nothing says why.
parody_web_annotate = ["templates/parody_web/*.html",
                       "static/parody_web_annotate/js/*.js",
                       "static/parody_web_annotate/css/*.css"]
parody_web_readaloud = ["templates/parody_web/*.html",
                        "static/parody_web_readaloud/js/*.js",
                        # The maths-speech helper, bundled with its deps: it
                        # runs on the host at generation time and cannot ask
                        # them to npm install beside site-packages.
                        "static/parody_web_readaloud/js/*.mjs",
                        "static/parody_web_readaloud/css/*.css"]
