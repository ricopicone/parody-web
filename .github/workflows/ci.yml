name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Both extras, for the same reason: pypdf and PyMuPDF are optional
      # DEPENDENCIES, but tests_printing and the read-along geometry tests are
      # not optional TESTS. A plain `uv sync` leaves them out and those modules
      # fail to import — which is what kept main red after the print work, and
      # again after read-along landed.
      - run: uv sync --extra print --extra readalong
      # Node is what read-along speaks maths with. Without it the SRE tests
      # skip rather than fail, but skipping them on CI means the one path that
      # actually runs the engine is never exercised.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: uv run python runtests.py
      - run: node --test assets/annotate/*.test.js assets/readaloud/*.test.js
